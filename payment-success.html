<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement Réussi - VerifIA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #05050A;
            --card-bg: rgba(20, 20, 28, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --accent-primary: #ffd700;
            --accent-secondary: #ffa500;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .background-glow {
            position: absolute;
            top: -20%;
            left: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.12) 0%, rgba(5, 5, 10, 0) 70%);
            z-index: -1;
            filter: blur(60px);
        }

        .background-glow-2 {
            position: absolute;
            bottom: -20%;
            right: -10%;
            width: 50%;
            height: 50%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.12) 0%, rgba(5, 5, 10, 0) 70%);
            z-index: -1;
            filter: blur(60px);
        }

        .success-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 3.5rem 2.5rem;
            width: 90%;
            max-width: 480px;
            text-align: center;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: cardPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        @keyframes cardPop {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .success-icon-wrap {
            width: 96px;
            height: 96px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            color: var(--success);
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.2);
            animation: pulseSuccess 2s infinite;
        }

        @keyframes pulseSuccess {
            0% { box-shadow: 0 0 20px rgba(16, 185, 129, 0.2); }
            50% { box-shadow: 0 0 40px rgba(16, 185, 129, 0.4); }
            100% { box-shadow: 0 0 20px rgba(16, 185, 129, 0.2); }
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #ffffff, #e5e7eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge-premium-glow {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, #ffd700, #ffa500);
            color: #05050a;
            font-weight: 800;
            font-size: 0.8rem;
            padding: 5px 14px;
            border-radius: 9999px;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            animation: floatBadge 3s ease-in-out infinite;
        }

        @keyframes floatBadge {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
            100% { transform: translateY(0px); }
        }

        p {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .btn-continue {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(to right, #8b5cf6, #3b82f6);
            color: white;
            text-decoration: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.05rem;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
            transition: all 0.2s ease;
        }

        .btn-continue:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.5);
        }
    </style>
</head>
<body>
    <div class="background-glow"></div>
    <div class="background-glow-2"></div>

    <div class="success-card">
        <div class="success-icon-wrap">
            <i data-lucide="check-check" style="width: 48px; height: 48px;"></i>
        </div>
        
        <div class="badge-premium-glow">
            <i data-lucide="sparkles" style="width: 14px; height: 14px;"></i> Accès Pro Activé
        </div>
        
        <h1>Merci pour votre achat !</h1>
        <p id="successMessage">Votre compte a été crédité avec succès. Vous bénéficiez désormais de vos nouveaux tests d'analyse neuronale sur VerifIA.</p>
        
        <a href="/" class="btn-continue">
            Lancer une analyse <i data-lucide="arrow-right"></i>
        </a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const tests = urlParams.get('tests');
        if (tests) {
            document.getElementById('successMessage').innerHTML = `Félicitations ! <strong>+${tests} tests</strong> ont été ajoutés avec succès à votre compte. Vous pouvez les utiliser immédiatement.`;
        }
    </script>

    <script>
        lucide.createIcons();

        // Trigger confetti!
        window.addEventListener('DOMContentLoaded', () => {
            const duration = 3 * 1000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#8b5cf6', '#3b82f6', '#ffd700']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#8b5cf6', '#3b82f6', '#ffd700']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        });
    </script>
</body>
</html>
