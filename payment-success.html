<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement Réussi - VerifIA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #FAF9F6;
            --card-bg: #FFFFFF;
            --border-color: #E6E4DD;
            --text-primary: #1C1917;
            --text-secondary: #57534E;
            --accent-primary: #15803D;
            --accent-subtle: #DCFCE7;
            --success: #15803D;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .success-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 3rem 2.25rem;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(28, 25, 23, 0.06);
            animation: cardPop 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardPop {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .success-icon-wrap {
            width: 72px;
            height: 72px;
            background: var(--accent-subtle);
            border: 1px solid #BBF7D0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            color: var(--success);
        }

        h1 {
            font-family: 'Outfit', 'Inter', sans-serif;
            font-size: 1.85rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .badge-premium-glow {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--accent-subtle);
            color: var(--accent-primary);
            font-weight: 700;
            font-size: 0.8rem;
            padding: 4px 12px;
            border-radius: 9999px;
            margin-bottom: 1.25rem;
            letter-spacing: 0.3px;
        }

        p {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .btn-continue {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--accent-primary);
            color: white;
            text-decoration: none;
            padding: 0.85rem 1.75rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            width: 100%;
            box-shadow: 0 2px 8px rgba(21, 128, 61, 0.25);
            transition: all 0.2s ease;
        }

        .btn-continue:hover {
            background: #166534;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="background-glow"></div>
    <div class="background-glow-2"></div>

    <div class="success-card">
        <div class="success-icon-wrap">
            <i data-lucide="check-check" style="width: 48px; height: 48px;"></i>
        </div>
        
        <div class="badge-premium-glow">
            <i data-lucide="sparkles" style="width: 14px; height: 14px;"></i> Accès Pro Activé
        </div>
        
        <h1>Merci pour votre achat !</h1>
        <p id="successMessage">Votre compte a été crédité avec succès. Vous bénéficiez désormais de vos nouveaux tests d'analyse neuronale sur VerifIA.</p>
        
        <a href="/" class="btn-continue">
            Lancer une analyse <i data-lucide="arrow-right"></i>
        </a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const tests = urlParams.get('tests');
        if (tests) {
            document.getElementById('successMessage').innerHTML = `Félicitations ! <strong>+${tests} tests</strong> ont été ajoutés avec succès à votre compte. Vous pouvez les utiliser immédiatement.`;
        }
    </script>

    <script>
        lucide.createIcons();

        // Trigger confetti!
        window.addEventListener('DOMContentLoaded', () => {
            const duration = 3 * 1000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#8b5cf6', '#3b82f6', '#ffd700']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#8b5cf6', '#3b82f6', '#ffd700']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        });
    </script>
</body>
</html>
