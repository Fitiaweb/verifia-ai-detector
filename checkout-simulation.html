<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revolut Checkout - VerifIA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --revolut-blue: #0073ec;
            --revolut-dark: #191c1f;
            --revolut-light: #f4f6f8;
            --revolut-border: #e0e6ed;
            --revolut-text: #191c1f;
            --revolut-text-secondary: #6c7a89;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--revolut-light);
            color: var(--revolut-text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .checkout-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.02);
            width: 100%;
            max-width: 480px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 24px;
            border-bottom: 1px solid var(--revolut-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
        }

        .revolut-logo {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 1.4rem;
            color: var(--revolut-dark);
            letter-spacing: -0.5px;
        }

        .revolut-logo span {
            color: var(--revolut-blue);
        }

        .secure-badge {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            color: #10b981;
            background: rgba(16, 185, 129, 0.08);
            padding: 4px 10px;
            border-radius: 999px;
            font-weight: 600;
        }

        .order-summary {
            padding: 24px;
            background: #fafbfc;
            border-bottom: 1px solid var(--revolut-border);
        }

        .merchant-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .merchant-avatar {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: #8b5cf6;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(139, 92, 246, 0.2);
        }

        .merchant-details h3 {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .merchant-details p {
            font-size: 0.8rem;
            color: var(--revolut-text-secondary);
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .price-label {
            font-size: 0.9rem;
            color: var(--revolut-text-secondary);
        }

        .price-val {
            font-size: 1.8rem;
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
            color: var(--revolut-dark);
        }

        .payment-form {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--revolut-text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: var(--revolut-text-secondary);
        }

        .payment-input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1px solid var(--revolut-border);
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .payment-input:focus {
            border-color: var(--revolut-blue);
            box-shadow: 0 0 0 3px rgba(0, 115, 236, 0.1);
        }

        .row-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .row-grid .payment-input {
            padding-left: 14px;
        }

        .btn-pay {
            background: var(--revolut-blue);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-pay:hover {
            background: #0060c7;
        }

        .btn-pay:active {
            transform: scale(0.98);
        }

        .footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: var(--revolut-text-secondary);
            padding: 16px;
            border-top: 1px solid var(--revolut-border);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .loader {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="checkout-container">
        <div class="header">
            <div class="revolut-logo">R<span>evolut</span></div>
            <div class="secure-badge">
                <i data-lucide="shield-check" style="width: 14px; height: 14px;"></i> Sécurisé
            </div>
        </div>
        
        <div class="order-summary">
            <div class="merchant-info">
                <div class="merchant-avatar">V</div>
                <div class="merchant-details">
                    <h3>VerifIA SaaS</h3>
                    <p id="planDesc">Abonnement</p>
                </div>
            </div>
            
            <div class="price-row">
                <span class="price-label">Total à payer</span>
                <span class="price-val" id="priceVal">0,00 €</span>
            </div>
        </div>
        
        <form class="payment-form" id="payForm">
            <h2 class="form-title">Paiement par carte de crédit</h2>
            
            <div class="input-group">
                <label>Numéro de carte</label>
                <div class="input-wrapper">
                    <i data-lucide="credit-card" style="width: 18px; height: 18px;"></i>
                    <input type="text" class="payment-input" placeholder="4596 0012 3456 7890" required maxlength="19" id="cardNum">
                </div>
            </div>
            
            <div class="row-grid">
                <div class="input-group">
                    <label>Date d'expiration</label>
                    <input type="text" class="payment-input" placeholder="MM/AA" required maxlength="5" id="cardExpiry">
                </div>
                <div class="input-group">
                    <label>CVC / CVV</label>
                    <input type="password" class="payment-input" placeholder="123" required maxlength="3" id="cardCvc">
                </div>
            </div>
            
            <button type="submit" class="btn-pay" id="payBtn">
                <span class="loader" id="payLoader"></span>
                <span id="payText">Payer maintenant</span>
            </button>
        </form>
        
        <div class="footer-note">
            <i data-lucide="lock" style="width: 12px; height: 12px;"></i>
            Propulsé par Revolut Merchant Gateway (Simulation)
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Parse query params
        const urlParams = new URLSearchParams(window.location.search);
        const plan = urlParams.get('plan') || 'monthly';
        const email = urlParams.get('email') || '';
        const orderId = urlParams.get('session_id') || 'sim_order_' + Math.random().toString(36).substr(2, 9);

        const planDesc = document.getElementById('planDesc');
        const priceVal = document.getElementById('priceVal');
        const payText = document.getElementById('payText');
        const payLoader = document.getElementById('payLoader');
        const payBtn = document.getElementById('payBtn');

        let amount = "4,99 €";
        if (plan === 'annual') {
            planDesc.textContent = "VerifIA - Abonnement Annuel Pro";
            priceVal.textContent = "29,99 €";
            payText.textContent = "Payer 29,99 €";
        } else {
            planDesc.textContent = "VerifIA - Abonnement Mensuel Pro";
            priceVal.textContent = "4,99 €";
            payText.textContent = "Payer 4,99 €";
        }

        // Format card inputs
        document.getElementById('cardNum').addEventListener('input', (e) => {
            let v = e.target.value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
            let matches = v.match(/\d{4,16}/g);
            let match = matches && matches[0] || '';
            let parts = [];

            for (let i = 0, len = match.length; i < len; i += 4) {
                parts.push(match.substring(i, i + 4));
            }

            if (parts.length > 0) {
                e.target.value = parts.join(' ');
            } else {
                e.target.value = v;
            }
        });

        document.getElementById('cardExpiry').addEventListener('input', (e) => {
            let v = e.target.value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
            if (v.length >= 2) {
                e.target.value = v.substring(0, 2) + '/' + v.substring(2, 4);
            } else {
                e.target.value = v;
            }
        });

        // Submit form
        document.getElementById('payForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Show loader
            payLoader.style.display = 'block';
            payText.textContent = 'Traitement sécurisé...';
            payBtn.disabled = true;

            setTimeout(() => {
                // Redirect back to our confirm backend API endpoint
                window.location.href = `/api/payments/confirm?email=${encodeURIComponent(email)}&plan=${plan}&order_id=${orderId}`;
            }, 1800);
        });
    </script>
</body>
</html>
